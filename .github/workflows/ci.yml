name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# A new push on a branch cancels the previous, still-running pipeline.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '24'

jobs:

  # =========================================================================
  # Detects which parts of the monorepo actually exist / changed.
  # The backend and frontend are scaffolded in parallel, so every downstream
  # job must be able to skip cleanly instead of failing on missing code.
  # =========================================================================
  detect:
    name: Detect workspaces
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.check.outputs.backend }}
      frontend: ${{ steps.check.outputs.frontend }}
      compose: ${{ steps.check.outputs.compose }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        name: Look for composer.json / package.json / docker-compose.yml
        run: |
          set -euo pipefail

          if [ -f backend/composer.json ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Backend skipped::backend/composer.json not found yet"
          fi

          if [ -f frontend/package.json ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Frontend skipped::frontend/package.json not found yet"
          fi

          if [ -f docker-compose.yml ]; then
            echo "compose=true" >> "$GITHUB_OUTPUT"
          else
            echo "compose=false" >> "$GITHUB_OUTPUT"
          fi

  # =========================================================================
  # Backend :: PHP 8.4 + PostgreSQL 16
  # =========================================================================
  backend:
    name: Backend (PHP ${{ needs.detect.outputs.backend == 'true' && '8.4' || 'skipped' }})
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.backend == 'true'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Base database matching DATABASE_URL below. Doctrine appends the
          # `_test` suffix by itself in the test environment (see the
          # `when@test: dbname_suffix` block in config/packages/doctrine.yaml),
          # so the tests really run on `manga_stream_test`, created by the
          # "Prepare the test database" step.
          POSTGRES_DB: manga_stream
          POSTGRES_USER: manga
          POSTGRES_PASSWORD: manga
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U manga -d manga_stream"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      APP_DEBUG: '0'
      APP_SECRET: ci_secret_not_used_in_production
      # 127.0.0.1 and not `database`: in CI the service container is published
      # on the runner's localhost, there is no compose network here.
      DATABASE_URL: postgresql://manga:manga@127.0.0.1:5432/manga_stream?serverVersion=16&charset=utf8
      MERCURE_URL: http://localhost:3000/.well-known/mercure
      MERCURE_PUBLIC_URL: http://localhost:3000/.well-known/mercure
      MERCURE_JWT_SECRET: '!ChangeThisMercureHubJWTSecretKey!'
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
      JWT_SECRET_KEY: '%kernel.project_dir%/config/jwt/private.pem'
      JWT_PUBLIC_KEY: '%kernel.project_dir%/config/jwt/public.pem'
      JWT_PASSPHRASE: ci_passphrase
      CORS_ALLOW_ORIGIN: '^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$'
      ANILIST_API_URL: https://graphql.anilist.co

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, intl, zip, opcache, ctype, iconv
          coverage: none
          tools: composer:v2
          ini-values: memory_limit=512M

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish || echo "::warning::composer validate reported issues"

      - name: Cache composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      # Generated with plain openssl rather than `lexik:jwt:generate-keypair`:
      # it needs no Symfony kernel boot, so the keys exist BEFORE any console
      # command runs. A JWT-secured application refuses to boot without them.
      # These CI keys live and die with the runner and are never committed.
      - name: Generate an ephemeral JWT keypair
        run: |
          set -euo pipefail
          mkdir -p config/jwt
          openssl genpkey -quiet -out config/jwt/private.pem \
            -aes256 -pass env:JWT_PASSPHRASE \
            -algorithm rsa -pkeyopt rsa_keygen_bits:4096
          openssl pkey -in config/jwt/private.pem -passin env:JWT_PASSPHRASE \
            -out config/jwt/public.pem -pubout
          chmod 600 config/jwt/private.pem
          echo "keypair generated in backend/config/jwt/ (CI only)"

      - name: Lint YAML configuration
        run: |
          if [ -d config ]; then
            php bin/console lint:yaml config --parse-tags || echo "::warning::lint:yaml reported issues"
          fi

      - name: Lint the service container
        run: php bin/console lint:container

      # APP_ENV=test is set for the whole job, so every console command below
      # already targets the test environment — and therefore the `_test`
      # suffixed database. We create it, then replay the migrations on it: the
      # tests must run against the real schema, `messenger_messages` included.
      - name: Prepare the test database
        run: |
          set -euo pipefail
          php bin/console doctrine:database:create --if-not-exists --no-interaction
          if [ -d migrations ] && [ -n "$(ls -A migrations 2>/dev/null)" ]; then
            php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
          else
            echo "::notice title=No migration yet::migrations/ is empty -> schema left untouched"
          fi

      # =====================================================================
      # Garde-fou de contrat : docs/openapi.yaml doit refléter le code.
      #
      # Le frontend génère ses types TypeScript directement depuis ce fichier
      # (`npm run generate:api` -> openapi-typescript). S'il dérive du code,
      # rien ne casse bruyamment : le front compile contre un contrat faux et
      # l'écart n'apparaît qu'à l'exécution, souvent chez l'utilisateur. On
      # régénère donc la spec et on compare.
      #
      # Deux précautions qui comptent :
      #
      #   * export vers un chemin TEMPORAIRE, jamais vers ../docs. D'abord
      #     parce qu'un job de CI n'a rien à faire réécrire un fichier versionné
      #     (il masquerait la dérive au lieu de la signaler), ensuite parce que
      #     `--output=../docs/...` échoue dès qu'on lance la commande dans le
      #     conteneur backend, où ../docs n'existe pas.
      #
      #   * le runner part d'un checkout neuf, donc sans var/cache. C'est
      #     précisément ce qui donne sa valeur au test : une spec régénérée
      #     depuis un cache périmé peut être incomplète et paraître conforme.
      #     C'est ce qui s'est produit sur ce dépôt — la spec committée décrit
      #     `popularity` comme filtre mais pas comme propriété des schémas
      #     Anime/Manga, parce qu'elle a été exportée depuis un conteneur dont
      #     le cache datait d'avant la migration.
      # =====================================================================
      - name: Contrat OpenAPI à jour
        run: |
          set -euo pipefail

          committed="../docs/openapi.yaml"
          generated="${RUNNER_TEMP}/openapi.generated.yaml"

          if [ ! -f "$committed" ]; then
            echo "::error title=Contrat absent::docs/openapi.yaml est introuvable. Générez-le : cd backend && php bin/console api:openapi:export --yaml --output=../docs/openapi.yaml"
            exit 1
          fi

          php bin/console api:openapi:export --yaml --output="$generated"

          if diff -u "$committed" "$generated" > "${RUNNER_TEMP}/openapi.diff" 2>&1; then
            echo "docs/openapi.yaml est conforme au code."
            exit 0
          fi

          echo "::error title=Contrat OpenAPI périmé::docs/openapi.yaml ne correspond plus au code backend. Régénérez-le et committez-le : cd backend && php bin/console api:openapi:export --yaml --output=../docs/openapi.yaml"
          echo
          echo "Écart (300 premières lignes de diff, committé vs régénéré) :"
          head -300 "${RUNNER_TEMP}/openapi.diff"
          echo
          echo "Total : $(grep -c '^[+-]' "${RUNNER_TEMP}/openapi.diff" || true) lignes divergentes."
          exit 1

      - name: Conserver la spec régénérée en cas d'écart
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-regenere
          path: ${{ runner.temp }}/openapi.generated.yaml
          retention-days: 3
          if-no-files-found: ignore

      # THE test step. As soon as the backend ships a phpunit configuration the
      # suite runs for real and a single failing test fails the whole pipeline:
      # no `|| true`, no `continue-on-error`, no warning-instead-of-error.
      # The only tolerated case is "no test written yet".
      - name: PHPUnit
        run: |
          set -euo pipefail

          # Three accepted names: the historical `phpunit.xml.dist`, the newer
          # `phpunit.dist.xml` (the one this project actually uses) and the
          # local override `phpunit.xml`. Forgetting one silently skips the
          # whole test suite — exactly the trap we are closing here.
          config=""
          for candidate in phpunit.dist.xml phpunit.xml.dist phpunit.xml; do
            if [ -f "$candidate" ]; then config="$candidate"; break; fi
          done

          if [ -z "$config" ]; then
            echo "::notice title=No test suite yet::no phpunit configuration found -> step skipped"
            exit 0
          fi
          echo "configuration found: $config"

          if [ -x vendor/bin/phpunit ]; then
            PHPUNIT="vendor/bin/phpunit"
          elif [ -x bin/phpunit ]; then
            PHPUNIT="php bin/phpunit"
          else
            echo "::error title=PHPUnit is missing::a phpunit configuration exists but no binary is installed. Run: composer require --dev symfony/test-pack"
            exit 1
          fi

          echo "running $PHPUNIT against $DATABASE_URL (test env -> _test suffix)"
          $PHPUNIT --colors=never

          # PHPUnit exits 0 when the suite is empty ("No tests executed!").
          # Not an error today — the backend has committed its configuration
          # but not its tests yet — so we only make the situation visible.
          echo "::notice title=PHPUnit ran::configuration $config. If the report says 'No tests executed', the suite is still empty."

      - name: PHPStan (optional)
        run: |
          if [ -f phpstan.neon ] || [ -f phpstan.neon.dist ] || [ -f phpstan.dist.neon ]; then
            if [ -x vendor/bin/phpstan ]; then
              vendor/bin/phpstan analyse --no-progress
            else
              echo "::warning::phpstan config found but vendor/bin/phpstan is missing -> skip"
            fi
          else
            echo "phpstan not configured -> skip"
          fi

      - name: PHP-CS-Fixer (optional, dry-run)
        run: |
          if [ -f .php-cs-fixer.dist.php ] || [ -f .php-cs-fixer.php ]; then
            if [ -x vendor/bin/php-cs-fixer ]; then
              vendor/bin/php-cs-fixer fix --dry-run --diff --no-interaction
            else
              echo "::warning::php-cs-fixer config found but the binary is missing -> skip"
            fi
          else
            echo "php-cs-fixer not configured -> skip"
          fi

  # =========================================================================
  # Frontend :: Node 24 + Vite
  # =========================================================================
  frontend:
    name: Frontend (Node 24)
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.frontend == 'true'

    defaults:
      run:
        working-directory: frontend

    env:
      VITE_API_URL: http://localhost:8000/api
      VITE_MERCURE_URL: http://localhost:3000/.well-known/mercure
      VITE_USE_MOCKS: 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('frontend/package-lock.json', 'frontend/package.json') }}
          restore-keys: npm-${{ runner.os }}-node${{ env.NODE_VERSION }}-

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning title=No lockfile::package-lock.json is missing, falling back to npm install. Commit the lockfile to make CI reproducible."
            npm install
          fi

      - name: Lint
        run: |
          if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
            npm run lint
          else
            echo "::notice title=No lint script::skip"
          fi

      - name: Type-check
        run: |
          if [ -f tsconfig.json ] && node -e "process.exit(require('./package.json').scripts?.typecheck ? 0 : 1)"; then
            npm run typecheck
          else
            echo "type-check runs as part of the build (tsc -b) -> skip standalone step"
          fi

      - name: Build
        run: |
          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            npm run build
          else
            echo "::warning title=No build script::skip"
          fi

      - name: Unit tests (optional)
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm run test -- --run 2>/dev/null || npm run test
          else
            echo "::notice title=No test script::skip"
          fi

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3
          if-no-files-found: ignore

  # =========================================================================
  # Docker :: compose syntax + image builds
  # =========================================================================
  docker:
    name: Docker compose
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.compose == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env from the template
        run: cp .env.example .env

      - name: Validate the compose file
        run: docker compose config --quiet && docker compose config

      # The entrypoint drives both php-fpm and the Messenger worker: a syntax
      # error there takes down the backend AND the queue. `bash -n` parses the
      # script without executing anything.
      - name: Check the shell scripts syntax
        run: |
          set -euo pipefail
          for script in infra/*/docker-entrypoint.sh; do
            bash -n "$script" && echo "syntax OK: $script"
          done

      # The worker is not booted here on purpose: with no vendor/ in the repo
      # it would spend minutes on `composer install` for a very weak signal.
      # We only assert that compose really declares it and points it at the
      # worker command.
      - name: Check that the Messenger worker is declared
        run: |
          set -euo pipefail
          docker compose config --services | grep -qx worker
          docker compose config | grep -q -- '- worker'
          echo 'the worker service is declared and runs the worker command'

      - name: Check that the shared API contract is not ignored
        run: |
          if [ -f docs/openapi.yaml ]; then
            if git check-ignore -q docs/openapi.yaml; then
              echo "::error title=openapi.yaml is gitignored::docs/openapi.yaml is the shared backend<->frontend contract and must stay tracked"
              exit 1
            fi
            echo "docs/openapi.yaml is tracked, good"
          else
            echo "::notice::docs/openapi.yaml not written yet -> skip"
          fi

      # This repository is PUBLIC. A committed private.pem or .env would let
      # anyone forge a JWT for any account. Belt and braces: we check both that
      # the paths are gitignored and that nothing sensitive is already tracked.
      - name: Check that no secret can be committed
        run: |
          set -euo pipefail
          status=0

          for path in backend/config/jwt/private.pem backend/config/jwt/public.pem .env; do
            if git check-ignore -q "$path"; then
              echo "ignored (good): $path"
            else
              echo "::error title=$path is not gitignored::this file holds secrets and must never reach a public repository"
              status=1
            fi
          done

          tracked=$(git ls-files -- 'backend/config/jwt/*' '.env' '**/*.pem' | grep -v '\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error title=Secret tracked by git::$(echo "$tracked" | tr '\n' ' ')"
            status=1
          fi

          exit $status

      - name: Pull the third-party images
        run: docker compose pull --ignore-buildable --quiet || true

      - name: Build the backend image
        if: needs.detect.outputs.backend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./infra/backend/Dockerfile
          target: dev
          build-contexts: infra=./infra
          push: false
          load: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build the frontend image (dev + prod stages)
        if: needs.detect.outputs.frontend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./infra/frontend/Dockerfile
          target: prod
          build-contexts: infra=./infra
          push: false
          load: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: "Smoke test: database + mercure actually start"
        run: |
          set -e
          docker compose up -d database mercure
          for i in $(seq 1 30); do
            db=$(docker inspect --format '{{ .State.Health.Status }}' manga-stream-database 2>/dev/null || echo starting)
            hub=$(docker inspect --format '{{ .State.Health.Status }}' manga-stream-mercure 2>/dev/null || echo starting)
            echo "attempt $i :: database=$db mercure=$hub"
            [ "$db" = "healthy" ] && [ "$hub" = "healthy" ] && break
            sleep 3
          done
          docker compose ps
          [ "$(docker inspect --format '{{ .State.Health.Status }}' manga-stream-database)" = "healthy" ]
          [ "$(docker inspect --format '{{ .State.Health.Status }}' manga-stream-mercure)" = "healthy" ]
          curl -sf http://localhost:3000/healthz > /dev/null && echo "mercure /healthz OK"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  # =========================================================================
  # Single required status check for branch protection.
  # =========================================================================
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [detect, backend, frontend, docker]
    if: always()
    steps:
      - name: Fail if any job failed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::at least one job did not succeed"
              exit 1
            fi
          done
          echo "all jobs succeeded or were skipped"
