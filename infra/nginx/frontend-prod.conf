# ---------------------------------------------------------------------------
# manga-stream :: nginx vhost serving the built Vite SPA (prod stage)
# Root : /usr/share/nginx/html (contents of frontend/dist)
# ---------------------------------------------------------------------------

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # En-têtes de sécurité. Voir l'avertissement en tête du fichier inclus :
    # les deux `location` ci-dessous qui posent un Cache-Control doivent le
    # ré-inclure, sinon elles perdent tout.
    include /etc/nginx/snippets/security-headers.conf;

    # --- compression -------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # --- hashed assets: immutable, cache hard ------------------------------
    location /assets/ {
        expires 1y;
        # Obligatoire : ce bloc pose un add_header, il perdrait donc sinon
        # tous les en-têtes de sécurité hérités du `server`.
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- the HTML shell must never be cached -------------------------------
    location = /index.html {
        # Idem : ré-inclusion obligatoire à cause du add_header ci-dessous.
        # C'est LE bloc où l'oubli coûterait le plus cher — c'est la page qui
        # porte l'application.
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # --- SPA history fallback ----------------------------------------------
    location / {
        try_files $uri /index.html;
    }

    # Do not fall back to index.html for the API namespace: a missing API route
    # must return a real 404, not the SPA shell.
    location /api/ {
        return 404;
    }

    error_page 404 /index.html;

    error_log  /var/log/nginx/frontend_error.log;
    access_log /var/log/nginx/frontend_access.log;
}
