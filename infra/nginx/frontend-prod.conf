# ---------------------------------------------------------------------------
# manga-stream :: nginx vhost serving the built Vite SPA (prod stage)
# Root : /usr/share/nginx/html (contents of frontend/dist)
# ---------------------------------------------------------------------------

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- compression -------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # --- hashed assets: immutable, cache hard ------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- the HTML shell must never be cached -------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # --- SPA history fallback ----------------------------------------------
    location / {
        try_files $uri /index.html;
    }

    # Do not fall back to index.html for the API namespace: a missing API route
    # must return a real 404, not the SPA shell.
    location /api/ {
        return 404;
    }

    error_page 404 /index.html;

    error_log  /var/log/nginx/frontend_error.log;
    access_log /var/log/nginx/frontend_access.log;
}
