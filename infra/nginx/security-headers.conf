# ---------------------------------------------------------------------------
# manga-stream :: en-têtes de sécurité HTTP, partagés par les deux vhosts
#
# Inclus depuis :
#   infra/nginx/default.conf        (API Symfony)
#   infra/nginx/frontend-prod.conf  (SPA statique)
#
# ⚠️  PIÈGE NGINX, la raison pour laquelle ce fichier est inclus PLUSIEURS FOIS
#     dans un même vhost :
#
#     `add_header` n'est PAS cumulatif entre niveaux. Les directives d'un bloc
#     ne sont héritées du bloc parent QUE si le bloc enfant n'en déclare
#     aucune. Dès qu'une `location` pose son propre `add_header` (typiquement
#     un `Cache-Control`), elle perd d'un coup TOUS les en-têtes du `server`.
#
#     Conséquence concrète : `location /assets/` et `location = /index.html`
#     dans frontend-prod.conf déclarent un Cache-Control, donc elles doivent
#     ré-inclure ce fichier. Sans ça les en-têtes de sécurité disparaissent
#     silencieusement sur les assets — et on ne s'en rend jamais compte en
#     regardant la page d'accueil.
#
#     Vérifier après toute modification :
#       curl -sI http://localhost:8000/ | grep -i -E 'x-content|referrer|csp|content-security'
#       curl -sI http://localhost:8000/assets/index.js | grep -i x-content-type
# ---------------------------------------------------------------------------

# Empêche le navigateur de "deviner" un type MIME différent de celui annoncé.
# Sans lui, un fichier uploadé servi en text/plain mais contenant du HTML peut
# être interprété comme du HTML -> XSS stocké.
add_header X-Content-Type-Options "nosniff" always;

# Pas de Referer complet vers l'extérieur : une URL d'API peut contenir des
# identifiants de ressource qu'on ne veut pas fuiter dans les logs d'un tiers.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Anti-clickjacking. `frame-ancestors` dans la CSP est la version moderne et
# fait autorité, X-Frame-Options reste là pour les vieux navigateurs.
add_header X-Frame-Options "DENY" always;

# Coupe l'accès aux APIs navigateur dont l'application n'a aucun usage.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# --- Content-Security-Policy ------------------------------------------------
# Politique volontairement stricte, avec deux assouplissements assumés :
#
#   style-src 'unsafe-inline'
#     React et la plupart des libs UI posent des styles inline via l'attribut
#     `style`. Les interdire casserait l'application. Le risque résiduel est
#     faible comparé à script-src, qui lui reste strict.
#
#   img-src https:
#     Les jaquettes viennent du CDN AniList (s4.anilist.co). Restreindre à ce
#     seul domaine serait plus propre, mais AniList sert aussi depuis d'autres
#     hôtes selon les médias ; on autorise donc le HTTPS en lecture d'image,
#     ce qui ne permet aucune exécution de code.
#
# connect-src 'self' suffit en production PARCE QUE l'API et le hub Mercure
# sont servis derrière ce même nginx (voir `location /.well-known/mercure`).
# Si un jour le hub est exposé sur un autre domaine, il faut l'ajouter ici,
# sinon EventSource sera bloqué par le navigateur — symptôme typique : la page
# fonctionne mais aucune notification n'arrive, sans erreur réseau visible.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# --- HSTS -------------------------------------------------------------------
# DÉLIBÉRÉMENT COMMENTÉ : il n'y a pas de TLS sur cette stack.
#
# Envoyer HSTS en clair est au mieux ignoré, au pire un piège : le navigateur
# mémorise la directive pour des mois et refusera ensuite tout accès HTTP au
# domaine. Sur `localhost`, cela rend le poste de dev inutilisable pour ce
# domaine sans purge manuelle du cache HSTS.
#
# À décommenter le jour où un certificat est en place, et pas avant :
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
