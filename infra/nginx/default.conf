# ---------------------------------------------------------------------------
# manga-stream :: nginx vhost for the Symfony backend (front controller)
# Upstream : backend:9000 (php-fpm)
# Exposed  : http://localhost:8000
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Résolution DNS des conteneurs voisins
#
# Pas de bloc `upstream { server backend:9000; }` ici, volontairement : nginx
# ne résout un nom d'hôte d'upstream qu'UNE FOIS, au chargement de la config,
# et met l'adresse IP en cache pour toute la durée de vie du process.
#
# En développement c'est un piège permanent : dès qu'on reconstruit l'image du
# backend, `docker compose up -d` recrée le conteneur, qui obtient une NOUVELLE
# IP sur le réseau bridge. nginx continue de taper l'ancienne et répond 502
# jusqu'à ce que quelqu'un pense à le redémarrer lui aussi. Symptôme vécu :
# backend `healthy`, nginx `unhealthy`, 502 sur toute l'API.
#
# 127.0.0.11 est le résolveur DNS interne de Docker. Associé à un nom d'hôte
# passé par VARIABLE (voir `set $php_upstream` plus bas), il force nginx à
# re-résoudre, en respectant le TTL `valid=10s`.
#
# ipv6=off : le réseau compose est en IPv4 seul ; sans ça nginx tente une
# résolution AAAA qui échoue et journalise une erreur à chaque requête.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# ---------------------------------------------------------------------------
# Schéma réel de la requête, vu du navigateur
#
# En dev, nginx est en frontal : $scheme dit la vérité (http).
# En production, il est DERRIÈRE le terminaison TLS (Caddy). La connexion
# Caddy -> nginx est en clair, $scheme vaut donc "http" alors que le visiteur
# est bien en https. Sans ce report, Symfony génère des URLs absolues en http
# (liens de réinitialisation de mot de passe, Link header Mercure) et les
# cookies `secure` ne sont jamais posés.
#
# On reprend donc X-Forwarded-Proto quand l'amont en fournit un, et on retombe
# sur $scheme sinon. Le filtrage n'accepte que deux valeurs littérales : une
# valeur exotique injectée par un client retombe sur $scheme.
#
# Point de vigilance : ce nginx ne doit PAS être exposé directement sur
# Internet en production (seul Caddy publie 80/443, voir
# docker-compose.prod.yml). C'est ce qui garantit que le X-Forwarded-Proto
# entrant vient bien du terminateur TLS.
# ---------------------------------------------------------------------------
map $http_x_forwarded_proto $forwarded_proto {
    default  $scheme;
    https    https;
    http     http;
}

# Idem pour le port public annoncé au visiteur (443 derrière Caddy, 8000 en
# dev). N'accepte qu'un nombre.
map $http_x_forwarded_port $forwarded_port {
    default    $server_port;
    "~^\d+$"   $http_x_forwarded_port;
}

# Hôte public. En dev c'est localhost:8000, en prod le vrai domaine.
map $http_x_forwarded_host $forwarded_host {
    default  $http_host;
    "~."     $http_x_forwarded_host;
}

# `HTTPS=on` (convention CGI) uniquement quand le visiteur est réellement en
# TLS. `if_not_empty` côté fastcgi_param fait le reste : la variable vide n'est
# pas transmise, ce qui est différent de « transmise à vide ».
map $forwarded_proto $https_flag {
    default  "";
    https    on;
}

# ---------------------------------------------------------------------------
# Journal enrichi
#
# Le format `combined` par défaut ne journalise que $remote_addr — c'est-à-dire
# l'IP de l'amont immédiat. Pour diagnostiquer un limiteur de débit, on veut
# voir les DEUX : ce que nginx a vu, et ce qu'il transmet à l'application.
# ---------------------------------------------------------------------------
log_format manga_stream_proxy
    '$remote_addr fwd="$http_x_forwarded_for" '
    'sent_fwd="$proxy_add_x_forwarded_for" proto=$forwarded_proto '
    '"$request" $status $body_bytes_sent rt=$request_time';

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;

    client_max_body_size 32m;

    # Masque le numéro de version dans l'en-tête Server et les pages d'erreur.
    server_tokens off;

    # En-têtes de sécurité. Relire l'avertissement en tête du fichier : chaque
    # `location` qui pose son propre `add_header` doit le ré-inclure.
    include /etc/nginx/snippets/security-headers.conf;

    # --- health endpoints ---------------------------------------------------
    # Liveness of nginx alone.
    location = /nginx-health {
        access_log off;
        # Ce bloc déclare un add_header : sans la ré-inclusion, il perdrait
        # tous les en-têtes de sécurité du niveau `server`.
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # End-to-end liveness: nginx -> php-fpm. Answers "pong" straight from the
    # FPM master (ping.path in the pool config), so it stays 200 even before a
    # single Symfony route exists.
    # SCRIPT_NAME must be set explicitly: FPM matches ping.path against it, and
    # the generic fastcgi_params value does not survive the internal rewrite.
    location = /fpm-ping {
        access_log off;
        include fastcgi_params;
        fastcgi_param SCRIPT_NAME /fpm-ping;
        fastcgi_param SCRIPT_FILENAME "";
        set $php_upstream backend:9000;
        fastcgi_pass $php_upstream;
    }

    # Symfony front controller: everything that is not a real file goes to
    # index.php. Never expose any other .php script.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Mercure hub reverse-proxied under the same origin (avoids CORS/EventSource
    # issues when the frontend is served from this vhost in production).
    location /.well-known/mercure {
        # $request_uri est OBLIGATOIRE dès qu'un proxy_pass contient une
        # variable : nginx cesse alors de transmettre l'URI d'origine
        # automatiquement, et sans lui toutes les requêtes arriveraient sur "/".
        set $mercure_upstream mercure:80;
        proxy_pass http://$mercure_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # $forwarded_proto et non $scheme : derrière Caddy, la connexion
        # Caddy -> nginx est en clair. Le hub doit savoir que l'abonné, lui,
        # est en https, sinon les URLs qu'il renvoie et la politique de cookie
        # divergent de la réalité du navigateur.
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        # Le cookie mercureAuthorization doit traverser : sans lui le hub
        # refuse l'abonnement (MERCURE_ALLOW_ANONYMOUS=false).
        proxy_pass_request_headers on;
        proxy_buffering off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
    }

    location ~ ^/index\.php(/|$) {
        # Passer par une variable est ce qui déclenche la re-résolution DNS à
        # chaque requête (cf. `resolver` en tête de fichier). Avec un nom écrit
        # en dur, nginx figerait l'IP au démarrage.
        set $php_upstream backend:9000;
        fastcgi_pass $php_upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;

        # -------------------------------------------------------------------
        # Propagation de l'identité du client jusqu'à PHP
        #
        # LE point critique de tout ce fichier. En FastCGI, REMOTE_ADDR est
        # l'adresse de l'émetteur de la requête FastCGI, donc celle de nginx
        # (172.21.0.250). L'application ne voit JAMAIS l'IP du visiteur si on
        # ne la lui passe pas explicitement : un limiteur de débit indexé sur
        # l'IP compterait alors tout le trafic sur une seule clé, et le premier
        # attaquant sur /api/login verrouillerait la connexion de tous les
        # utilisateurs.
        #
        # nginx ne rajoute rien de lui-même : il retransmet les en-têtes reçus
        # du client sous forme HTTP_*, mais n'en fabrique aucun. D'où ces
        # fastcgi_param. Ils ont priorité — un en-tête explicitement déclaré
        # ici n'est pas retransmis une seconde fois depuis la requête cliente,
        # nginx l'exclut de la retransmission automatique.
        #
        # $proxy_add_x_forwarded_for = "<valeur reçue>, <$remote_addr>", donc
        # la valeur ajoutée par nginx est TOUJOURS la dernière. Un client qui
        # envoie « X-Forwarded-For: 1.2.3.4 » produit "1.2.3.4, <sa vraie IP>" :
        # Symfony, qui remonte la liste de droite à gauche en s'arrêtant à la
        # première adresse non-fiable, tombe sur la vraie IP. L'usurpation est
        # donc inopérante — À CONDITION que la liste des proxys de confiance
        # (SYMFONY_TRUSTED_PROXIES) ne contienne QUE l'IP de nginx et pas la
        # plage entière : la passerelle Docker, qui est l'adresse source des
        # requêtes venues du Mac, appartient à cette plage.
        #
        # X-Real-IP n'est pas lu par Symfony (il n'est pas dans les
        # trusted_headers) : il est là pour le diagnostic et pour les
        # bibliothèques tierces qui l'attendent.
        # -------------------------------------------------------------------
        fastcgi_param HTTP_X_FORWARDED_FOR   $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST  $forwarded_host;
        fastcgi_param HTTP_X_FORWARDED_PORT  $forwarded_port;
        fastcgi_param HTTP_X_REAL_IP         $remote_addr;
        # HTTPS=on quand le visiteur est en TLS : c'est ce que regardent les
        # briques PHP qui ignorent les en-têtes X-Forwarded-*.
        fastcgi_param HTTPS                  $https_flag if_not_empty;

        # Long-lived responses (streamed API, profiler) need a generous timeout.
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        internal;
    }

    # Return 404 for any other PHP file instead of executing it.
    location ~ \.php$ {
        return 404;
    }

    error_log  /var/log/nginx/backend_error.log;
    # Deux destinations : le fichier au format enrichi (qui montre l'IP
    # transmise à l'application) et stdout au format standard pour
    # `docker compose logs nginx`.
    access_log /var/log/nginx/backend_access.log manga_stream_proxy;
    access_log /dev/stdout manga_stream_proxy;
}
