# ---------------------------------------------------------------------------
# manga-stream :: nginx vhost for the Symfony backend (front controller)
# Upstream : backend:9000 (php-fpm)
# Exposed  : http://localhost:8000
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Résolution DNS des conteneurs voisins
#
# Pas de bloc `upstream { server backend:9000; }` ici, volontairement : nginx
# ne résout un nom d'hôte d'upstream qu'UNE FOIS, au chargement de la config,
# et met l'adresse IP en cache pour toute la durée de vie du process.
#
# En développement c'est un piège permanent : dès qu'on reconstruit l'image du
# backend, `docker compose up -d` recrée le conteneur, qui obtient une NOUVELLE
# IP sur le réseau bridge. nginx continue de taper l'ancienne et répond 502
# jusqu'à ce que quelqu'un pense à le redémarrer lui aussi. Symptôme vécu :
# backend `healthy`, nginx `unhealthy`, 502 sur toute l'API.
#
# 127.0.0.11 est le résolveur DNS interne de Docker. Associé à un nom d'hôte
# passé par VARIABLE (voir `set $php_upstream` plus bas), il force nginx à
# re-résoudre, en respectant le TTL `valid=10s`.
#
# ipv6=off : le réseau compose est en IPv4 seul ; sans ça nginx tente une
# résolution AAAA qui échoue et journalise une erreur à chaque requête.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;

    client_max_body_size 32m;

    # Masque le numéro de version dans l'en-tête Server et les pages d'erreur.
    server_tokens off;

    # En-têtes de sécurité. Relire l'avertissement en tête du fichier : chaque
    # `location` qui pose son propre `add_header` doit le ré-inclure.
    include /etc/nginx/snippets/security-headers.conf;

    # --- health endpoints ---------------------------------------------------
    # Liveness of nginx alone.
    location = /nginx-health {
        access_log off;
        # Ce bloc déclare un add_header : sans la ré-inclusion, il perdrait
        # tous les en-têtes de sécurité du niveau `server`.
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # End-to-end liveness: nginx -> php-fpm. Answers "pong" straight from the
    # FPM master (ping.path in the pool config), so it stays 200 even before a
    # single Symfony route exists.
    # SCRIPT_NAME must be set explicitly: FPM matches ping.path against it, and
    # the generic fastcgi_params value does not survive the internal rewrite.
    location = /fpm-ping {
        access_log off;
        include fastcgi_params;
        fastcgi_param SCRIPT_NAME /fpm-ping;
        fastcgi_param SCRIPT_FILENAME "";
        set $php_upstream backend:9000;
        fastcgi_pass $php_upstream;
    }

    # Symfony front controller: everything that is not a real file goes to
    # index.php. Never expose any other .php script.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Mercure hub reverse-proxied under the same origin (avoids CORS/EventSource
    # issues when the frontend is served from this vhost in production).
    location /.well-known/mercure {
        # $request_uri est OBLIGATOIRE dès qu'un proxy_pass contient une
        # variable : nginx cesse alors de transmettre l'URI d'origine
        # automatiquement, et sans lui toutes les requêtes arriveraient sur "/".
        set $mercure_upstream mercure:80;
        proxy_pass http://$mercure_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
    }

    location ~ ^/index\.php(/|$) {
        # Passer par une variable est ce qui déclenche la re-résolution DNS à
        # chaque requête (cf. `resolver` en tête de fichier). Avec un nom écrit
        # en dur, nginx figerait l'IP au démarrage.
        set $php_upstream backend:9000;
        fastcgi_pass $php_upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;

        # Long-lived responses (streamed API, profiler) need a generous timeout.
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        internal;
    }

    # Return 404 for any other PHP file instead of executing it.
    location ~ \.php$ {
        return 404;
    }

    error_log  /var/log/nginx/backend_error.log;
    access_log /var/log/nginx/backend_access.log;
}
