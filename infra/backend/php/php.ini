; ---------------------------------------------------------------------------
; manga-stream :: PHP runtime configuration (dev-oriented defaults)
; Loaded as /usr/local/etc/php/conf.d/zz-manga-stream.ini
; ---------------------------------------------------------------------------

memory_limit = 512M
max_execution_time = 60
post_max_size = 32M
upload_max_filesize = 32M

date.timezone = UTC
expose_php = Off

; --- errors ----------------------------------------------------------------
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL

; --- opcache ---------------------------------------------------------------
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
; Symfony recommends preloading in prod; enable it there via config/preload.php
; opcache.preload = /var/www/html/config/preload.php
; opcache.preload_user = app

; --- realpath cache (big win with Symfony) ---------------------------------
realpath_cache_size = 4096K
realpath_cache_ttl = 600
