; ---------------------------------------------------------------------------
; manga-stream :: pool PHP-FPM de PRODUCTION
;
; Chargé en /usr/local/etc/php-fpm.d/zzz-manga-stream-prod.conf, donc APRÈS
; zz-manga-stream.conf : ce fichier gagne. Copié uniquement par le stage `prod`.
;
; ---------------------------------------------------------------------------
; CE QUI CASSERAIT EN PREMIER SANS CE FICHIER
;
; Mesuré sur la production (t3.micro, 908 Mo, 4 Go de swap) : un enfant
; php-fpm pèse ~50 Mo résidents, le master ~20 Mo, et le reste de la stack
; (PostgreSQL 52 Mo, Caddy 40 Mo, worker 40 Mo, Mercure 17 Mo, cron 8 Mo,
; frontend 7 Mo, nginx 2 Mo) occupe déjà ~170 Mo. Au repos : 538 Mo utilisés,
; 370 Mo disponibles.
;
; Avec le réglage de développement (pm.max_children = 20), il suffit de 20
; requêtes simultanées — un robot d'indexation un peu vif, ou un partage de
; lien qui marche — pour que PHP réclame 20 x 50 Mo = 1 Go À LUI SEUL. La
; machine part alors en swap ; et comme le swap est sur EBS, chaque défaut de
; page devient un aller-retour réseau. Le premier à en mourir n'est pas PHP :
; c'est PostgreSQL, le plus gros processus de la machine, donc la cible
; naturelle du tueur OOM du noyau. On perd la base pour une rafale de trafic
; HTTP.
;
; 6 enfants au maximum bornent PHP à ~360 Mo. Au-delà, les requêtes ATTENDENT
; dans la file d'écoute au lieu de faire tomber la machine : une latence, pas
; une panne. C'est le bon compromis quand on n'a pas de mémoire à perdre.
;
; POUR MONTER EN CHARGE : ajouter de la RAM avant de toucher à max_children.
; La règle de dimensionnement est (RAM disponible pour PHP) / 60 Mo.
; ---------------------------------------------------------------------------

[www]
; `dynamic` et non `ondemand` : sur un site à faible trafic, `ondemand` ferait
; payer un démarrage de processus à la première requête après chaque creux —
; visible par le visiteur. Deux enfants restent chauds en permanence.
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Recyclage plus fréquent qu'en développement : un enfant qui a servi 200
; requêtes est remplacé, ce qui rend toute fuite mémoire lente sans effet.
pm.max_requests = 200

; File d'attente devant le pool. Sans elle, une rafale au-delà de 6 requêtes
; simultanées se traduirait par un « connection refused » côté nginx (502) ;
; avec elle, elle attend. 64 est volontairement modeste : au-delà, mieux vaut
; rendre une erreur franche que faire patienter une minute.
listen.backlog = 64

; Une requête qui dure plus de 30 s sur ce projet est un bug, pas un traitement
; long : les traitements longs (synchronisation AniList, envois d'e-mails)
; passent par Messenger et le service `worker`. On la tue, avec une trace.
request_terminate_timeout = 30s
request_slowlog_timeout = 10s
slowlog = /proc/self/fd/2

; Plafond mémoire PAR REQUÊTE HTTP, indépendant du memory_limit global.
; `php_admin_value` = non surchargeable par ini_set() depuis le code.
;
; Il ne s'applique QU'AUX ENFANTS FPM : les commandes CLI (synchronisation
; AniList, migrations, worker Messenger) gardent les 512 Mo de php.ini, dont
; elles ont réellement besoin pour traiter les lots AniList. C'est la raison
; pour laquelle ce réglage est ici et pas dans php-prod.ini.
php_admin_value[memory_limit] = 192M
