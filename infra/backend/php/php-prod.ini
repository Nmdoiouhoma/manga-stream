; ---------------------------------------------------------------------------
; manga-stream :: surcharges PHP de PRODUCTION
;
; Chargé en /usr/local/etc/php/conf.d/zzz-manga-stream-prod.ini, donc APRÈS
; zz-manga-stream.ini (ordre alphabétique) : ce fichier gagne. Il n'est copié
; que par le stage `prod` du Dockerfile — le développement garde les réglages
; confortables de php.ini.
;
; TOUT CE FICHIER EST DIMENSIONNÉ POUR UNE t3.micro À 908 Mo DE RAM,
; qui héberge en plus PostgreSQL, Caddy, nginx, Mercure, le worker Messenger,
; le planificateur et le service de sauvegarde. Les valeurs par défaut de
; php.ini ne sont pas « fausses » : elles sont écrites pour une machine qui
; n'aurait à faire tourner que PHP.
; ---------------------------------------------------------------------------

; --- opcache ---------------------------------------------------------------
; 256 Mo réservés par conteneur (backend + worker + cron = 768 Mo annoncés sur
; une machine qui en a 908) alors que Symfony + API Platform compilés tiennent
; largement sous 90 Mo. opcache alloue paresseusement, donc ce n'était pas
; fatal — mais c'est de la place annoncée pour rien, et ça masque le vrai
; besoin quand on lit la mémoire de la machine.
opcache.memory_consumption = 96
opcache.interned_strings_buffer = 12
opcache.max_accelerated_files = 16000

; Le code d'un conteneur de production ne change JAMAIS pendant sa vie : il est
; figé dans l'image. Vérifier la date de chaque fichier à chaque requête est un
; coût pur. Corollaire assumé, et c'est déjà la procédure de déploiement ici :
; un changement de code impose de recréer le conteneur, pas de recharger PHP.
opcache.validate_timestamps = 0

; NOTE sur le préchargement (opcache.preload) : on ne l'active pas. Il ferait
; gagner du CPU au prix de ~60 Mo résidents en permanence, et il fige les
; classes au démarrage du master php-fpm — une classe manquante ou une erreur
; de préchargement rend le pool inutilisable d'un coup. Sur 908 Mo, ce marché
; n'est pas bon. À reconsidérer sur une machine plus grande.

; --- erreurs ---------------------------------------------------------------
; Redit ici explicitement : afficher une trace PHP à un visiteur, en
; production, c'est publier des chemins de fichiers et des extraits de code.
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED
