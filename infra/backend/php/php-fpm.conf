; ---------------------------------------------------------------------------
; manga-stream :: PHP-FPM pool overrides
; Loaded as /usr/local/etc/php-fpm.d/zz-manga-stream.conf (last wins)
; ---------------------------------------------------------------------------

[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
; The container already runs as the non-root `app` user, so the user/group
; directives are intentionally omitted (php-fpm ignores them when not root).
listen = 0.0.0.0:9000

; Forward the container environment (DATABASE_URL, APP_ENV, MERCURE_*, ...)
; to the PHP workers. Required, otherwise Symfony sees an empty $_ENV.
clear_env = no

; Send worker stdout/stderr to the container logs.
catch_workers_output = yes
decorate_workers_output = no

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Simple health endpoint, useful for the compose healthcheck.
ping.path = /fpm-ping
ping.response = pong
