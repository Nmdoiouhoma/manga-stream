framework:
    messenger:
        failure_transport: failed

        transports:
            # Transport Doctrine : la file vit dans la table `messenger_messages` de la
            # base principale — aucune dépendance d'infrastructure supplémentaire.
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 5000
                    multiplier: 3
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            App\Message\SyncAnilistPage: async
            App\Message\SyncAnilistEpisodes: async
            # E-mails transactionnels. Expédiés par le worker, jamais dans la
            # requête HTTP : un relais SMTP lent ou injoignable ferait pendre
            # `POST /api/password/forgot`, et son temps de réponse varierait selon
            # que l'adresse existe ou non — ce qui rétablirait l'oracle
            # d'énumération que son 204 systématique supprime.
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                failed: 'in-memory://'
