# ===========================================================================
# manga-stream :: development stack
#
#   cp .env.example .env && docker compose up -d
#
#   http://localhost:5173  frontend (Vite dev server, HMR)
#   http://localhost:8000  backend API (nginx -> php-fpm -> Symfony)
#   http://localhost:3000  Mercure hub (/.well-known/mercure)
#   postgres://localhost:5432  database
#
# Internal hostnames (container -> container): database, backend, nginx,
# mercure, frontend, worker. See infra/README.md.
# ===========================================================================

name: manga-stream

# ===========================================================================
# Shared configuration blocks (YAML anchors)
#
# `&name` defines an anchor, `*name` reuses it and `<<:` merges a mapping.
# Docker Compose resolves all of this BEFORE reading the services, so
# `docker compose config` shows the fully expanded result — run it whenever
# you are unsure of what a service really receives.
#
# The backend (php-fpm) and the worker (messenger:consume) are the SAME
# application, so they must see the SAME environment. Defining it once
# guarantees they can never drift apart.
# ===========================================================================
x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-dev}
  APP_DEBUG: ${APP_DEBUG:-1}
  APP_SECRET: ${APP_SECRET:-changeme_dev_secret}
  # Hostname is `database` (the compose service name), NOT localhost.
  DATABASE_URL: ${DATABASE_URL:-postgresql://manga:manga@database:5432/manga_stream?serverVersion=16&charset=utf8}
  DATABASE_HOST: database
  DATABASE_PORT: 5432
  # Server-side publishing endpoint (container -> container).
  MERCURE_URL: ${MERCURE_URL:-http://mercure/.well-known/mercure}
  # Endpoint advertised to browsers in the Link header.
  MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:-http://localhost:3000/.well-known/mercure}
  # Shared HS256 secret: the backend signs its publisher JWT with it, the hub
  # verifies it with the same value. Both MUST match.
  MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
  # RSA keypair used by lexik/jwt-authentication-bundle. The files are
  # generated on first boot by infra/backend/docker-entrypoint.sh and are
  # gitignored — never commit them, this repository is public.
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-%kernel.project_dir%/config/jwt/private.pem}
  JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-%kernel.project_dir%/config/jwt/public.pem}
  JWT_PASSPHRASE: ${JWT_PASSPHRASE:-manga_stream_dev_passphrase}
  # Access-token lifetime, in seconds.
  JWT_TTL: ${JWT_TTL:-3600}
  CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$$}
  # Messenger transport. `doctrine://default` stores the queue in the
  # `messenger_messages` table of the main database; auto_setup=0 means the
  # table comes from a Doctrine migration, not from an implicit CREATE TABLE.
  MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-doctrine://default?auto_setup=0}
  # Anilist GraphQL endpoint, called by `app:anilist:sync` and by the worker.
  ANILIST_API_URL: ${ANILIST_API_URL:-https://graphql.anilist.co}
  # Base URL used by Symfony to build absolute URLs outside of an HTTP
  # request (CLI commands, mailer, Mercure Link headers).
  DEFAULT_URI: ${DEFAULT_URI:-http://localhost:8000}
  # Set to 1 to run doctrine:migrations:migrate on container start.
  RUN_MIGRATIONS: ${RUN_MIGRATIONS:-0}

# Build definition shared by `backend` and `worker`: same Dockerfile, same
# image, so the worker always runs exactly the code the API runs.
x-backend-build: &backend-build
  context: ./backend
  dockerfile: ../infra/backend/Dockerfile
  target: dev
  additional_contexts:
    infra: ./infra
  args:
    UID: ${UID:-1000}
    GID: ${GID:-1000}

services:

  # -------------------------------------------------------------------------
  # PostgreSQL 16
  # -------------------------------------------------------------------------
  database:
    image: postgres:16-alpine
    container_name: manga-stream-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-manga_stream}
      POSTGRES_USER: ${POSTGRES_USER:-manga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-manga}
      # Deterministic collation, avoids "database was created with a different
      # collation version" warnings between alpine upgrades.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U ${POSTGRES_USER:-manga} -d ${POSTGRES_DB:-manga_stream} -h 127.0.0.1"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - manga-stream

  # -------------------------------------------------------------------------
  # Symfony / PHP-FPM  (no published port: reached through nginx)
  # -------------------------------------------------------------------------
  backend:
    build: *backend-build
    image: manga-stream-backend:dev
    container_name: manga-stream-backend
    restart: unless-stopped
    environment:
      <<: *backend-env
      PHP_IDE_CONFIG: serverName=manga-stream
    volumes:
      - ./backend:/var/www/html:cached
      - composer_cache:/composer
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -v > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - manga-stream

  # -------------------------------------------------------------------------
  # Messenger worker (asynchronous jobs: Anilist sync, notifications, ...)
  #
  # Same image and same code as `backend`, but instead of serving HTTP it runs
  #   php bin/console messenger:consume async -vv \
  #       --time-limit=3600 --memory-limit=128M
  # in a supervision loop implemented in infra/backend/docker-entrypoint.sh.
  #
  # Why a loop instead of just `command:`?
  #   1. --time-limit / --memory-limit make the consumer exit ON PURPOSE, to
  #      avoid long-running PHP memory leaks. Something must restart it.
  #   2. The `async` transport and its `messenger_messages` table arrive with a
  #      backend migration. Until then the command fails; the loop waits and
  #      retries every 15s instead of letting Docker restart the container in a
  #      tight, noisy crash loop.
  #
  # Tuning knobs (all optional, see .env.example): MESSENGER_CONSUME_TRANSPORTS,
  # MESSENGER_TIME_LIMIT, MESSENGER_MEMORY_LIMIT, MESSENGER_RETRY_DELAY.
  #
  # Scale it with:  docker compose up -d --scale worker=3
  # (this is why it has no container_name: a fixed name forbids scaling).
  # -------------------------------------------------------------------------
  worker:
    build: *backend-build
    image: manga-stream-backend:dev
    restart: unless-stopped
    # `worker` is not a binary: it is a pseudo-command understood by
    # infra/backend/docker-entrypoint.sh.
    command: ["worker"]
    environment:
      <<: *backend-env
      MESSENGER_CONSUME_TRANSPORTS: ${MESSENGER_CONSUME_TRANSPORTS:-async}
      MESSENGER_TIME_LIMIT: ${MESSENGER_TIME_LIMIT:-3600}
      MESSENGER_MEMORY_LIMIT: ${MESSENGER_MEMORY_LIMIT:-128M}
      MESSENGER_RETRY_DELAY: ${MESSENGER_RETRY_DELAY:-15}
    volumes:
      - ./backend:/var/www/html:cached
      - composer_cache:/composer
    depends_on:
      database:
        condition: service_healthy
    # Give Messenger time to finish the message in flight on `compose down`.
    stop_grace_period: 30s
    # No healthcheck on purpose: an idle worker with nothing to consume is a
    # perfectly healthy worker, and there is no cheap probe that tells the
    # difference. Watch it with `docker compose logs -f worker`.
    networks:
      - manga-stream

  # -------------------------------------------------------------------------
  # Planificateur de la synchronisation AniList
  #
  # Même image que le backend (donc même code, même vendor/), mais son seul
  # rôle est de déclencher `app:anilist:sync` une fois par jour.
  #
  # Le point important n'est pas « lancer une commande toutes les 24 h » —
  # crond sait le faire — mais de NE PAS repartir de zéro à chaque
  # redémarrage. L'état de la dernière exécution vit dans le volume
  # `anilist_sync_state` ; au démarrage le script relit la date de fin et
  # n'attend que le temps restant. Cinq `docker compose up` d'affilée ne
  # déclenchent donc pas cinq synchros.
  #
  #   docker compose exec cron anilist-sync-status   # dernière exécution
  #   docker compose exec cron anilist-sync-now      # forcer maintenant
  #   docker compose logs -f cron
  # -------------------------------------------------------------------------
  cron:
    build: *backend-build
    image: manga-stream-backend:dev
    container_name: manga-stream-cron
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/anilist-cron.sh"]
    command: ["loop"]
    environment:
      <<: *backend-env
      ANILIST_SYNC_ENABLED: ${ANILIST_SYNC_ENABLED:-true}
      ANILIST_SYNC_INTERVAL: ${ANILIST_SYNC_INTERVAL:-86400}
      ANILIST_SYNC_RETRY_DELAY: ${ANILIST_SYNC_RETRY_DELAY:-1800}
      ANILIST_SYNC_STARTUP_DELAY: ${ANILIST_SYNC_STARTUP_DELAY:-60}
      ANILIST_SYNC_RUN_ON_BOOT: ${ANILIST_SYNC_RUN_ON_BOOT:-ifnever}
      ANILIST_SYNC_TYPE: ${ANILIST_SYNC_TYPE:-BOTH}
      ANILIST_SYNC_PAGES: ${ANILIST_SYNC_PAGES:-5}
      ANILIST_SYNC_PER_PAGE: ${ANILIST_SYNC_PER_PAGE:-50}
      ANILIST_SYNC_TIMEOUT: ${ANILIST_SYNC_TIMEOUT:-3600}
    volumes:
      - ./backend:/var/www/html:cached
      - composer_cache:/composer
      - ./infra/cron/docker-entrypoint.sh:/usr/local/bin/anilist-cron.sh:ro
      # Raccourcis pour `docker compose exec cron anilist-sync-status|now`.
      - ./infra/cron/anilist-sync-status:/usr/local/bin/anilist-sync-status:ro
      - ./infra/cron/anilist-sync-now:/usr/local/bin/anilist-sync-now:ro
      # L'état DOIT survivre au conteneur : c'est tout l'intérêt.
      - anilist_sync_state:/state
    depends_on:
      database:
        condition: service_healthy
    # Une synchro en cours parle à une API externe et écrit en base : on lui
    # laisse le temps de finir proprement plutôt que de la couper au milieu
    # d'une page.
    stop_grace_period: 60s
    # Pas de healthcheck : un planificateur qui dort en attendant son créneau
    # est un planificateur en bonne santé. Le vrai indicateur est l'état de la
    # dernière exécution -> `docker compose exec cron anilist-sync-status`.
    networks:
      - manga-stream

  # -------------------------------------------------------------------------
  # nginx -> Symfony front controller
  # -------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: manga-stream-nginx
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Monté sous snippets/ et NON sous conf.d/ : nginx charge d'office
      # conf.d/*.conf au niveau http, ce qui appliquerait les en-têtes
      # globalement et hors de tout contrôle. Ici il n'est chargé que par les
      # `include` explicites des vhosts.
      - ./infra/nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
      # nginx needs the source tree to resolve $realpath_root and serve
      # anything sitting in public/ (uploads, favicon, ...).
      - ./backend:/var/www/html:ro
    depends_on:
      - backend
    healthcheck:
      # Exercises the whole chain nginx -> php-fpm -> Symfony and accepts any
      # non-5xx status: a 404 (no route defined yet) still proves the stack is
      # up, whereas a 502 (php-fpm down) correctly fails.
      test:
        - CMD-SHELL
        - "[ \"$$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1/)\" -lt 500 ]"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - manga-stream

  # -------------------------------------------------------------------------
  # Vite dev server (React + TypeScript)
  # -------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: ../infra/frontend/Dockerfile
      target: dev
      additional_contexts:
        infra: ./infra
      args:
        # Leave empty. Temporary escape hatch for peer-dependency conflicts,
        # see infra/frontend/Dockerfile.
        NPM_INSTALL_FLAGS: ${NPM_INSTALL_FLAGS:-}
    container_name: manga-stream-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      # Vite only exposes variables prefixed with VITE_ to the browser bundle.
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
      VITE_MERCURE_URL: ${VITE_MERCURE_URL:-http://localhost:3000/.well-known/mercure}
      # Optional override of the subscribed topics (comma separated). Left
      # empty, the frontend falls back to its own defaults (see
      # frontend/src/config.ts). Passed through so the knob is actually usable
      # from .env instead of being silently dropped by compose.
      VITE_MERCURE_TOPICS: ${VITE_MERCURE_TOPICS:-}
      VITE_USE_MOCKS: ${VITE_USE_MOCKS:-false}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app:cached
      # Keep the container node_modules isolated from the host one
      # (native bindings differ between macOS and alpine/linux).
      - frontend_node_modules:/app/node_modules
    networks:
      - manga-stream

  # -------------------------------------------------------------------------
  # Mercure hub (real-time SSE)
  # -------------------------------------------------------------------------
  # Authorization model, in one paragraph:
  #   * publishing requires a JWT whose `mercure.publish` claim covers the
  #     topic -> only the backend holds one;
  #   * subscribing requires a JWT whose `mercure.subscribe` claim lists the
  #     topics the connection may read -> the backend mints a token scoped to
  #     the logged-in user and the browser sends it in the `mercureAuthorization`
  #     cookie. The hub filters PER CONNECTION: a token scoped on user A never
  #     delivers user B's updates, even if the client asks for B's topic.
  #
  # Anonymous subscriptions are OFF by default (MERCURE_ALLOW_ANONYMOUS=false).
  # With them on, any browser could open an EventSource on
  # /api/users/<anyone>/notifications. See infra/mercure/docker-entrypoint.sh.
  mercure:
    image: dunglas/mercure:latest
    container_name: manga-stream-mercure
    restart: unless-stopped
    # The wrapper computes MERCURE_EXTRA_DIRECTIVES, then `exec "$$@"`.
    # Beware: per the Compose spec, setting `entrypoint` RESETS the image CMD
    # to null — the caddy command line must therefore be repeated here. It is
    # the upstream default of dunglas/mercure; check it after a major image
    # bump with:  docker image inspect dunglas/mercure --format '{{.Config.Cmd}}'
    entrypoint: ["/usr/local/bin/mercure-entrypoint.sh"]
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    environment:
      # ":80" forces plain HTTP. Without it Caddy tries to provision a TLS
      # certificate for "localhost" and the hub never becomes reachable.
      SERVER_NAME: ":80"
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_PUBLISHER_JWT_ALG: HS256
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_SUBSCRIBER_JWT_ALG: HS256
      # false = every subscriber must present a JWT. Flip to true ONLY to
      # unblock local work, never in a deployed environment.
      MERCURE_ALLOW_ANONYMOUS: ${MERCURE_ALLOW_ANONYMOUS:-false}
      # Debug console on /.well-known/mercure/ui/. Off by default.
      MERCURE_DEMO_UI: ${MERCURE_DEMO_UI:-false}
      MERCURE_SUBSCRIPTIONS: ${MERCURE_SUBSCRIPTIONS:-true}
      MERCURE_TRANSPORT_PATH: /data/mercure.db
      # Credentialed CORS: the browser sends the mercureAuthorization cookie
      # with `withCredentials`, so the origin list must be exact — "*" is
      # rejected by the browser as soon as credentials are involved.
      MERCURE_CORS_ORIGINS: ${MERCURE_CORS_ORIGINS:-http://localhost:5173 http://127.0.0.1:5173 http://localhost:8000}
      MERCURE_PUBLISH_ORIGINS: ${MERCURE_PUBLISH_ORIGINS:-http://localhost:5173 http://localhost:8000 http://localhost:3000}
    ports:
      - "${MERCURE_PORT:-3000}:80"
    volumes:
      - ./infra/mercure/docker-entrypoint.sh:/usr/local/bin/mercure-entrypoint.sh:ro
      - mercure_data:/data
      - mercure_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 10s
    networks:
      - manga-stream

networks:
  manga-stream:
    driver: bridge

volumes:
  database_data:
  composer_cache:
  frontend_node_modules:
  mercure_data:
  mercure_config:
  # État du planificateur AniList (dernière exécution, historique, verrou).
  # Le supprimer (`docker compose down -v`) fait repartir la synchro au
  # prochain démarrage comme sur un clone neuf.
  anilist_sync_state:
