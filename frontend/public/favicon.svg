<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="manga-stream">
  <!--
    Un marque-page, coché.

    Le produit est un tracker : on y range ce qu'on suit et on coche ce qu'on a
    vu. Le marque-page dit la première moitié, la coche la seconde, et les deux
    restent lisibles à 16 px — ce qui n'était pas le cas de l'export précédent,
    six kilo-octets d'ellipses floutées sans rapport avec la marque.

    Le dégradé reprend les deux couleurs déjà porteuses de sens dans
    l'interface : --accent (#7c5cff) et --anime (#4fc3f7).
  -->
  <defs>
    <linearGradient id="ms-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff" />
      <stop offset="1" stop-color="#4fc3f7" />
    </linearGradient>
  </defs>

  <path
    fill="url(#ms-mark)"
    d="M9 2.5h14a3.5 3.5 0 0 1 3.5 3.5v22.4a1.4 1.4 0 0 1-2.24 1.12L16 23.4l-8.26 6.12A1.4 1.4 0 0 1 5.5 28.4V6A3.5 3.5 0 0 1 9 2.5z"
  />

  <path
    fill="none"
    stroke="#0a0a10"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    d="m10.8 12.6 3.6 3.6 6.8-6.8"
  />
</svg>
